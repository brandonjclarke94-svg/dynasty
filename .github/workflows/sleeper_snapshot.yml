name: Sleeper snapshot (test data)
on:
  workflow_dispatch:
    inputs:
      user: {description: 'Sleeper username', required: true, default: 'sgt592extreme'}
permissions:
  contents: read
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/sleeper_snapshot.py "${{ inputs.user }}" snap.json
      - uses: actions/upload-artifact@v4
        with: {name: sleeper-snapshot, path: snap.json, retention-days: 3}
