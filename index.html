<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Dynasty fantasy football rankings built from real game logs: values for any league format, picks, trade calculator."><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Dynasty Value Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
/* Layout: broadcast-booth dark. Sticky top bar (desktop tabs) + bottom tab bar on phones; one content column up to 1180px;
   rankings as a dense data table, profile as a right-hand panel (bottom sheet on phones). One accent (cobalt), gold reserved
   for the elite tier, position colour only as a thin marker. Committed single dark look. */
:root{
  --bg:#0A0C0F; --bg2:#0E1115; --surface:#13161B; --raised:#191D23; --hover:#1E232A; --line:#232831; --line2:#2E3440;
  --ink:#E9ECF1; --ink2:#C3C9D2; --muted:#848D9A; --faint:#5C6470;
  --accent:#5B8CFF; --accent-ink:#06122E; --accent-soft:rgba(91,140,255,.14);
  --gold:#D8B45A; --gold-soft:rgba(216,180,90,.13);
  --qb:#E26A80; --rb:#3DBB9F; --wr:#5E9CEB; --te:#E2A04E; --pk:#9AA3B0;
  --good:#43C487; --good-bg:rgba(67,196,135,.13); --warn:#E8B04A; --warn-bg:rgba(232,176,74,.13); --bad:#F06B6B; --bad-bg:rgba(240,107,107,.13);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px rgba(0,0,0,.35);
  --r:12px; --ease:cubic-bezier(.2,.7,.2,1);
  --f-display:'Big Shoulders Display','Oswald','Arial Narrow',system-ui,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 400px at 70% -100px, rgba(91,140,255,.07), transparent 70%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg2)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- top bar ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(14,17,21,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:8px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),#2E58D6);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:16px;color:#fff;letter-spacing:.02em}
.brand b{display:block;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtabs{display:none;gap:2px;margin-left:12px}
.dtabs button{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:600;font-size:13.5px;transition:color .15s,background .15s}
.dtabs button:hover{color:var(--ink);background:var(--hover)}
.dtabs button[aria-current="page"]{color:var(--ink);background:var(--raised);box-shadow:inset 0 -2px 0 var(--accent)}
@media (min-width:900px){.dtabs{display:flex}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--raised);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(67,196,135,.15)}
main{padding-block:18px 110px;display:grid;gap:16px}
@media (min-width:900px){main{padding-bottom:48px}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(14,17,21,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding-block:6px}
nav.tabs button{border:0;background:none;padding:6px 2px;border-radius:10px;color:var(--muted);display:grid;justify-items:center;gap:2px;font-size:10.5px;font-weight:600;letter-spacing:.02em}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{color:var(--accent)}
@media (min-width:900px){nav.tabs{display:none}}

/* ---------- surfaces & type ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.panel h2,.h2{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 6px;text-wrap:balance;line-height:1.05}
.panel h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:16px 0 6px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);font-size:13px;margin:0}
p{margin:0 0 8px;max-width:72ch}
.note{font-size:12.5px;color:var(--muted)}
.err{color:var(--bad);font-size:12.5px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.kv:last-of-type{border-bottom:0}

/* ---------- controls ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 10px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--muted);transition:background .15s var(--ease),color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 0 0 1px var(--line2),0 1px 2px rgba(0,0,0,.4)}
.search,select.sel{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:8px 12px;color:var(--ink);min-width:0;transition:border-color .15s}
.search{flex:1 1 220px;min-width:0}
.search::placeholder{color:var(--faint)}
.search:focus,select.sel:focus{border-color:var(--accent);outline:none}
select.sel{appearance:none;-webkit-appearance:none;padding-right:28px;font-size:12.5px;font-weight:600;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.btn{border:1px solid var(--line2);background:var(--raised);border-radius:10px;padding:8px 13px;font-weight:600;font-size:13px;color:var(--ink);transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--hover)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.iconbtn{width:36px;height:36px;padding:0;display:grid;place-items:center}

/* ---------- tags ---------- */
.pos{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink2)}
.pos::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--pk)}
.pos.QB::before{background:var(--qb)} .pos.RB::before{background:var(--rb)} .pos.WR::before{background:var(--wr)} .pos.TE::before{background:var(--te)}
.tm{display:inline-block;font-family:var(--f-mono);font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;letter-spacing:.03em;line-height:1.55}
.tm.fa{background:var(--raised);color:var(--muted);border:1px solid var(--line)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase;line-height:1.4;white-space:nowrap}
.tag.inj{background:var(--bad-bg);color:var(--bad)}
.tag.adj{background:var(--warn-bg);color:var(--warn)}
.tag.rook,.tag.new{background:var(--accent-soft);color:var(--accent)}
.tag.up{background:var(--good-bg);color:var(--good)}
.star{color:var(--gold)}
.ecr{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ecr b{font-weight:600}
.up{color:var(--good)} .dn{color:var(--bad)}
.ecr b.up{color:var(--good)} .ecr b.dn{color:var(--bad)}

/* ---------- rankings table ---------- */
.toolbar{position:relative;z-index:10;background:rgba(10,12,15,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  margin-inline:-16px;padding:10px 16px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.board{display:grid;gap:14px}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.thead,.row{display:grid;grid-template-columns:34px minmax(0,1fr) 78px;gap:10px;align-items:center}
.thead{display:none;padding:9px 14px;background:var(--bg2);border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.thead button{border:0;background:none;padding:0;font:inherit;letter-spacing:inherit;color:inherit;text-transform:inherit;display:inline-flex;gap:4px;align-items:center}
.thead button:hover{color:var(--ink)} .thead button.on{color:var(--ink)}
.thead .r{justify-content:flex-end;text-align:right}
.row{width:100%;text-align:left;border:0;background:transparent;padding:10px 14px;border-bottom:1px solid var(--line);position:relative;transition:background .12s}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--hover)}
div.row{cursor:default}
.row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:transparent}
.row.elite::before{background:var(--gold)}
.row .rk{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1;text-align:right;color:var(--ink2)}
.row.elite .rk{color:var(--gold)}
.row .nm{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.row .meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin-top:3px;flex-wrap:wrap}
.row .val{text-align:right}
.row .val b{font-family:var(--f-mono);font-size:15px;font-weight:600}
.row .val .d{display:block;font-family:var(--f-mono);font-size:11px;margin-top:1px}
.c{display:none;font-family:var(--f-mono);font-size:12.5px;color:var(--ink2);text-align:right}
.c.up{color:var(--good)} .c.dn{color:var(--bad)}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--pk);transform-origin:left;animation:grow .5s var(--ease)}
.bar i.QB{background:var(--qb)} .bar i.RB{background:var(--rb)} .bar i.WR{background:var(--wr)} .bar i.TE{background:var(--te)} .bar i.PK{background:var(--pk)}
@keyframes grow{from{transform:scaleX(0)}}
@media (min-width:760px){
  .toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px)}
  .thead{display:grid}
  .thead,.tbl .row{grid-template-columns:44px minmax(0,1fr) 54px 52px 58px 170px 64px 74px}
  .c{display:block}
  .row .val{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
  .row .val .bar{margin-top:0}
  .row .val .d{display:none}
  .row .meta .mob{display:none}
}
.tier{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tier b{color:var(--ink2);font-weight:700}
.tier.gold b{color:var(--gold)}
.tier::after{content:"";flex:1;height:1px;background:var(--line)}
.rowgrp{display:contents}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);font-size:24px;color:var(--ink);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.more{text-align:center;padding:12px}

/* ---------- dashboard ---------- */
.dash{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.dash{grid-template-columns:repeat(12,minmax(0,1fr))}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}}
.hero-strip{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.hero-strip h1{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,6vw,46px);letter-spacing:.02em;text-transform:uppercase;line-height:.95;margin:4px 0 0}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;min-width:0;box-shadow:var(--shadow)}
.kpi b{font-family:var(--f-mono);font-size:24px;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:grid}
.mini button{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:8px 2px;border-bottom:1px solid var(--line);transition:background .12s}
.mini button:last-child{border-bottom:0}
.mini button:hover{background:var(--hover)}
.mini .n{font-family:var(--f-display);font-weight:800;font-size:16px;color:var(--muted);text-align:right}
.mini .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .nm small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.mini .v{font-family:var(--f-mono);font-weight:600;font-size:13px;text-align:right}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin:10px 0 12px}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:12.5px}
.legend div{display:flex;justify-content:space-between;gap:8px}
.legend span{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.ladder{display:grid;gap:6px;margin-top:6px}
.ladder div{display:grid;grid-template-columns:52px minmax(0,1fr) 104px;gap:10px;align-items:center;font-size:12px}
.ladder .lb{color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:10.5px}
.ladder .tr{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.ladder .tr i{display:block;height:100%;background:var(--accent);border-radius:4px;opacity:.85}
.ladder .tr i.g{background:var(--gold)}
.ladder .rg{font-family:var(--f-mono);color:var(--ink2);text-align:right;white-space:nowrap}
.twocol{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:560px){.twocol{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- profile panel ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(3,4,6,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{background:var(--bg2);border:1px solid var(--line);width:100%;max-width:640px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));animation:up .28s var(--ease)}
@media (min-width:900px){.scrim{justify-content:flex-end;align-items:stretch}.sheet{max-width:560px;max-height:none;height:100%;border-radius:0;border-width:0 0 0 1px;animation:left .28s var(--ease);padding-top:22px}}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(40px);opacity:0}} @keyframes left{from{transform:translateX(40px);opacity:0}}
.sheet h2{font-family:var(--f-display);font-weight:900;font-size:34px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:.95;text-wrap:balance}
.sec{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.sec>.eyebrow{display:block;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.tiles>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:grid;gap:2px;min-width:0}
.tiles span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tiles b{font-family:var(--f-mono);font-size:19px;font-weight:600;line-height:1.2}
.tiles em{font-style:normal;font-size:11.5px;color:var(--muted)}
.sheettiles{margin:14px 0 6px;grid-template-columns:repeat(2,minmax(0,1fr))}
.sheettiles .hero{grid-column:1/-1;background:linear-gradient(135deg,rgba(91,140,255,.16),rgba(91,140,255,.04));border-color:rgba(91,140,255,.35)}
.sheettiles .hero b{font-size:40px;color:var(--ink)}
@media (min-width:520px){.sheettiles{grid-template-columns:1.4fr repeat(4,minmax(0,1fr))}.sheettiles .hero{grid-column:auto}}
.minesum .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:520px){.minesum .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.charts{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:520px){.charts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.chart svg{display:block;width:100%;height:auto;max-height:160px;overflow:visible}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.step{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .n{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--accent);line-height:1.2}
.step .t{font-weight:600;margin-bottom:4px}
.eq{font-family:var(--f-mono);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;overflow-x:auto;white-space:nowrap;color:var(--ink2)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink2)}
.tscroll{overflow-x:auto}
.yrs{display:flex;align-items:flex-end;gap:3px;height:76px;margin-top:8px}
.yrs div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.yrs i{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--accent);min-height:1px}
.yrs span{font-family:var(--f-mono);font-size:9.5px;color:var(--muted)}

/* ---------- forms, trade, misc ---------- */
.fgrid{display:grid;gap:14px}
.fld{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-items:center}
@media (min-width:640px){.fld{grid-template-columns:minmax(0,1fr) auto}}
.fld label{font-weight:600;font-size:13.5px}
.fld .hint{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.tgrid{grid-template-columns:1fr}}
.side{display:grid;gap:8px;align-content:start}
.pick{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.pick button{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:2px 4px}
.sugg{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.sugg button{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 10px;text-align:left}
.sugg button:hover{background:var(--hover)}
.sugg button:last-child{border-bottom:0}
.verdict{border-radius:var(--r);padding:12px 14px;font-weight:600;border:1px solid}
.verdict.fair{background:var(--good-bg);color:var(--good);border-color:rgba(67,196,135,.3)}
.verdict.off{background:var(--warn-bg);color:var(--warn);border-color:rgba(232,176,74,.3)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.chart.wide{grid-column:1/-1}
.hread{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:2px 0 6px;font-size:13px;color:var(--ink2)}
.hread b{color:var(--ink);font-weight:600}
.hread .num{font-family:var(--f-mono);font-size:18px;color:var(--ink);font-weight:600}
.hread .chg{margin-left:auto;font-family:var(--f-mono);font-size:12px}
.hread .chg.up{color:var(--good)}.hread .chg.dn{color:var(--bad)}

<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
/* ===== Dynasty Value Board engine (pure functions, no DOM) ===== */
const POS = ['QB','RB','WR','TE'];
// one season of raw stats, stored as an array to keep the database small
const F = ['g','att','py','ptd','pint','car','ry','rtd','tg','rec','recy','rectd','fl','fdP','fdR','fdU'];
const DEF = { teams:12, qb:1, rb:2, wr:3, te:1, flex:1, sf:1,
  ppr:1, tep:0.5, ptd:4, pyd:25, int:-2, fl:-2, fd:0, upside:1, dcw:1, star:1.15, mode:'neutral', league:'dynasty', athw:1 };
const PRESETS = {
  'Superflex PPR':      {qb:1, sf:1, ppr:1,   tep:0},
  'Superflex TE+':      {qb:1, sf:1, ppr:1,   tep:0.5},
  '1QB PPR':            {qb:1, sf:0, ppr:1,   tep:0},
  '1QB Half':           {qb:1, sf:0, ppr:0.5, tep:0},
  '2QB PPR':            {qb:2, sf:0, ppr:1,   tep:0} };
// formula shape, fitted position by position. Rp = the replacement ppg the shape was fitted at.
const PV = {   // refit Nov 12 2026 on three seasons of nflverse stats, against a 50/50 blend of PlayerProfiler and FantasyPros ECR (TE 75/25),
               // inside football guard rails: QBs fade ~35-40, RBs ~27-31, WRs/TEs ~31-35; at most a 20% yearly discount; QBs' records are trusted most
  QB:{k:24.07, mid:37.50, d:0.800, shr:20.0, a1:0.86, a3:0.37, inj:0.24, lam:0.015, dpA:44.52, sig:1.118, ys:0.00, Rp:12.70, tb:0.894, rook:0.214},
  RB:{k:14.27, mid:31.00, d:0.800, shr:33.1, a1:2.54, a3:0.59, inj:0.33, lam:0.613, dpA:20.45, sig:2.510, ys:0.01, Rp:7.19, tb:0.500, rook:1.200},
  WR:{k:12.49, mid:35.00, d:0.826, shr:30.0, a1:2.65, a3:0.76, inj:0.07, lam:0.247, dpA:23.85, sig:2.009, ys:0.24, Rp:8.12, tb:0.549, rook:0.477},
  TE:{k:10.58, mid:34.44, d:0.945, shr:30.0, a1:3.00, a3:0.69, inj:0.3, lam:0.421, dpA:19.94, sig:1.311, ys:0.00, Rp:7.38, tb:0.728, rook:0.129} };
const ROOK = {QB:0.25, RB:0.3, WR:0.6, TE:0.5};   // how far above replacement a first-overall pick starts, by position
const YF = {QB:true, RB:true, WR:true, TE:true};
// Team direction. Each future season of a player's career is weighted by how much it matters to you:
// win now leans on this season and next; rebuild cares little about this season and full value two-plus years out.
// It also tilts how much upside is worth and how far away future picks feel.
const MODES = {
  win:     {label:'Win now',  yr:j=> j===0 ? 1.6 : j===1 ? 1.2 : 0.85*Math.pow(0.8, j-2), up:0.85, later:[1, 0.75, 0.6]},
  neutral: {label:'Neutral',  yr:j=> 1,                                                    up:1,    later:[1, 0.9, 0.82]},
  rebuild: {label:'Rebuild',  yr:j=> j===0 ? 0.35 : j===1 ? 0.9 : 1.15,                     up:1.2,  later:[1, 0.97, 0.94]} };
const TGT = {base:0.8};
// Big changes. A player who changed teams since his last games produced those numbers in another offense, so his record is
// trusted 25% less and his range of outcomes is 15% wider. An outlook note (owner or the twice-weekly news check) moves his
// expected scoring: much worse -18%, worse -9%, better +9%, much better +18%. Dynasty applies 60% of it (situations change again).
const OUTLOOK = {'-2':0.82, '-1':0.91, '1':1.09, '2':1.18};
const MOVE_TRUST = 0.75, MOVE_SPREAD = 1.15;
function outMult(o, redraft){ if(!o || !o.f || !OUTLOOK[o.f]) return 1; const m = OUTLOOK[o.f]; return redraft ? m : 1 + 0.6*(m-1); }
// Injuries short of IR, from the latest injury report: expected games he'll still miss.
// Out: 1 game plus 0.75 for every straight week he's already been out (a long absence tends to run on), up to 6; Doubtful 0.8;
// Questionable 0.25; missed practice this week (injury, not rest) 0.3; concussions add half a game.
// An owner's note from the news ("out 4-6 weeks") outranks the report: games still to miss = the games he set, minus one per week since.
function ovrLeft(o, now){ if(!o || !o.games) return 0; const wks = Math.floor(Math.max(0, now - o.at)/(7*864e5)); return Math.max(0, o.games - wks); }
function expMiss(rep){ if(!rep) return 0; let m = rep.s==='Out' ? Math.min(6, 1 + 0.75*(rep.out||1)) : rep.s==='Doubtful' ? 0.8 : rep.s==='Questionable' ? 0.25 : rep.s==='DNP' ? 0.3 : 0;
  if(m && /concuss/i.test(rep.what||'')) m += 0.5; return m; }
// Athleticism (combine composite, in SDs) nudges draft slot, and only where it has predicted fantasy output beyond draft slot.
// Tested on 2017-23 draft classes (points in years 2-3): TEs clearly (t 2.4), RBs and QBs a little (t ~1, so shrunk hard), WRs not at all.
// One SD of athleticism counts like being drafted this many times earlier (exp(beta)): TE ~1.4x, RB ~1.05x, QB ~1.03x, WR 1x.
const ATH = {QB:0.03, RB:0.05, WR:0, TE:0.34};
// Depth chart. A young player behind a strong incumbent (same team and position, drafted before him) gets less work early.
// On 2008-23 draft classes, one SD stronger incumbent cost about what being drafted 1.1-1.25x later costs over his first
// three seasons (RB clearest, t 1.9; WR/TE t 1.4; QB t 0.8). Shrunk toward zero like athleticism, so it nudges, not decides.
const COMPB = {QB:0.06, RB:0.165, WR:0.08, TE:0.085};   // shrunk hard toward zero (a skeptical prior), so it only nudges
const BENCH = 0.2;
const ROOKSD = {QB:3, RB:1, WR:1, TE:1};   // QBs with no snaps carry a much wider range of outcomes than the fitted QB spread
const GF = 2;   // seasons of games until draft slot stops counting
const TEP0 = 0.5;   // the fitted values already price in a +0.5 TE premium
const DEPTH = 1.15;   // replacement sits a little below the last starter (bench depth)
// the format the shape was fitted in: 12 teams, superflex, full PPR, +0.5 TE premium
const REF = {teams:12, qb:1, rb:2, wr:3, te:1, flex:1, sf:1, ppr:1, tep:0.5, ptd:4, pyd:25, int:-2, fl:-2, fd:0};

function normName(s){ return String(s||'').toLowerCase().replace(/[.'’]/g,'').replace(/\b(jr|sr|ii|iii|iv|v)\b/g,'').replace(/[^a-z0-9]/g,''); }
function unpack(a){ if(!a) return null; const o={}; F.forEach((f,i)=>o[f]=+a[i]||0); return o; }
function seasonPts(a, pos, c, model){
  const s = unpack(a); if(!s || !s.g) return null;
  let p = s.py/c.pyd + s.ptd*c.ptd + s.pint*c.int + s.ry*0.1 + s.rtd*6 + s.recy*0.1 + s.rectd*6 + s.fl*c.fl
        + s.rec*(c.ppr + (pos==='TE' ? c.tep - (model ? TEP0 : 0) : 0));
  if(c.fd) p += (s.fdR+s.fdU)*c.fd;
  if(c.fdRec||c.fdRush||c.fdPass) p += s.fdR*(c.fdRec||0) + s.fdU*(c.fdRush||0) + s.fdP*(c.fdPass||0);   // first downs scored by type (e.g. UFFA: catch 1, run 0.5, pass 0.2)
  return {g:s.g, pts:p, ppg:p/s.g};
}
function nPdf(z){ return Math.exp(-z*z/2)/Math.sqrt(2*Math.PI); }
function nCdf(z){ const t=1/(1+0.2316419*Math.abs(z)); const d=0.3989423*Math.exp(-z*z/2); const pr=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>0?1-pr:pr; }

// weighted production: this season's games count a1x, last season 1x, two seasons ago a3x
function weighted(lines, Q){
  const c=PV[Q]; let num=0, den=0, gms=0;
  [[lines[0],c.a1],[lines[1],1],[lines[2],c.a3]].forEach(([l,w])=>{ if(l&&l.g){ num+=w*l.pts; den+=w*l.g; gms+=l.g; } });
  return {num, den, gms, ppg: den>0 ? num/den : null};
}
// Lifetime value. Returns the steps so the page can show its work.
function lifetime(Q, w, age, dp, injured, R, upside, dcw, mode, bench, om){
  const md = MODES[mode] || MODES.neutral;
  dcw = dcw==null ? 1 : dcw;
  const c = PV[Q], sc = R/c.Rp, st = {R, sc};
  let ppg;
  // thin samples are pulled toward what a player like this usually becomes: a first-round pick near or above replacement,
  // a late-round or undrafted player below it. A long track record outweighs this.
  const tdp = dp ? Math.max(0, 1 - Math.log(dp)/Math.log(257)) : 0;
  const rook = c.rook!=null ? c.rook : ROOK[Q];
  const youth = Math.max(0, Math.min(1, (26 - age)/3));     // draft slot stops mattering by about 26
  const target = R*Math.min(1.1, (c.tb!=null?c.tb:TGT.base) + rook*dcw*tdp*youth);
  st.target = target;
  if(w.den>0) ppg = (w.num + c.shr*target)/(w.den + c.shr);
  else { // no NFL games yet: expectation from draft slot alone (pick 1 well above replacement, day-3 picks below it)
    const t = dp ? Math.max(0, 1 - Math.log(dp)/Math.log(257)) : 0;
    ppg = R*Math.min(1.1, (c.tb!=null?c.tb:TGT.base) + (c.rook!=null?c.rook:ROOK[Q])*dcw*t); st.rookie = true;
    // not playing is information: deep into a season with no snaps means he's behind someone. Full markdown by week 8.
    if(bench){ st.bench = BENCH*bench; ppg *= 1 - st.bench; } }
  st.shrunk = ppg;
  if(w.den>0 && dp && age < 25.5 && c.lam >= 0.02){   // (QBs: the fit gave this ~no weight, so it's skipped)
    const prior = Math.max(0, (c.dpA - 3.3*Math.log(dp))*sc);
    // pedigree fades with age and with games played: after about two full seasons, production does the talking
    const l = Math.min(0.9, c.lam*dcw) * Math.min(1, (25.5-age)/3) * Math.max(0, 1 - w.gms/(GF*17));
    ppg = (1-l)*ppg + l*prior; st.prior = prior; st.lam = l;
  }
  if(om && om!==1){ st.preOut = ppg; ppg *= om; st.om = om; }   // situation change (new team, role, QB): expected scoring moved up or down
  st.ppg = ppg;
  // youth upside is earned by draft capital: a day-3 rookie doesn't carry a first-rounder's range of outcomes
  const yf = YF[Q] ? (dp ? Math.max(0.1, 1 - Math.log(dp)/Math.log(257)) : 0.3) : 1;
  let s=0, sm=0, surv=1; const yrs=[];
  for(let j=0;j<25;j++){
    const t = age+j; if(j>0) surv *= 1 - 1/(1+Math.exp(-(t-c.mid))); if(surv<0.01) break;
    const sd = (st.rookie ? 1 + (ROOKSD[Q]-1)*tdp : 1)*c.sig*upside*md.up*sc*(1 + c.ys*yf*Math.max(0,25-t)/3)*(1+0.15*j), z = (ppg-R)/sd;
    const yv = Math.pow(c.d,j)*surv*(sd*nPdf(z) + (ppg-R)*nCdf(z));
    s += yv; sm += md.yr(j)*yv; yrs.push({age:t, surv, yv:yv*c.k});
  }
  st.yrs = yrs; st.inj = injured ? c.inj : 0;
  st.value = c.k*s*(injured ? 1-c.inj : 1);
  st.tilt = s>0 ? sm/s : 1;   // how much of his value lands in the seasons your team direction cares about
  return st;
}
// who starts: dedicated slots first, then flex (RB/WR/TE), then superflex (any) go to the best remaining player
function replacement(cands, c){
  const L = {}; POS.forEach(q=>L[q]=cands.filter(x=>x.pos===q).map(x=>x.ppg).sort((a,b)=>b-a));
  const n = {QB:c.qb*c.teams, RB:c.rb*c.teams, WR:c.wr*c.teams, TE:c.te*c.teams};
  const take = elig => { let best=null; elig.forEach(q=>{ const v=L[q][n[q]]; if(v!=null && (best==null || v>L[best][n[best]])) best=q; }); if(best) n[best]++; };
  for(let i=0;i<(c.wt||0)*c.teams;i++) take(['WR','TE']);   // WR/TE-only flex, filled before the open flex
  for(let i=0;i<c.flex*c.teams;i++) take(['RB','WR','TE']);
  for(let i=0;i<c.sf*c.teams;i++) take(['QB','RB','WR','TE']);
  const R = {}, N = {};
  POS.forEach(q=>{ const idx = Math.round(n[q]*DEPTH); N[q]=n[q]; const arr=L[q]; R[q] = arr.length ? arr[Math.min(arr.length-1, idx)] : PV[q].Rp; });
  return {R, N};
}
// players: [{k,n,pos,team,age,ad,dp,inj,rk,s:{season:[...]}}]; adj: {k: pct}
function rankAll(players, cfgIn, now, adj){
  const c = {...DEF, ...cfgIn}; adj = adj||{};
  let S = 0; players.forEach(p=>Object.keys(p.s||{}).forEach(y=>{ if(p.s[y] && p.s[y][0]>0) S=Math.max(S,+y); }));
  const rows = players.filter(p=>POS.includes(p.pos)).map(p=>{
    const lines = [S, S-1, S-2].map(y=>seasonPts(p.s&&p.s[y], p.pos, c));          // what he scored, your scoring
    const w = weighted([S, S-1, S-2].map(y=>seasonPts(p.s&&p.s[y], p.pos, c, true)), p.pos);   // what the formula reads
    const age = p.age!=null ? p.age + (now - (p.ad||now))/(365.25*864e5) : null;
    return {...p, p, lines, w, ageNow:age};
  });
  // replacement level: the fitted level, moved by how much deeper or shallower your lineup is than the fitted format
  const lr = cfg => replacement(rows.map(r=>({pos:r.pos, w:weighted([0,1,2].map(i=>seasonPts(r.p.s&&r.p.s[[S,S-1,S-2][i]], r.pos, cfg, true)), r.pos)})).filter(x=>x.w.gms>=4).map(x=>({pos:x.pos, ppg:x.w.ppg})), cfg);
  const mine = lr(c), ref = lr({...DEF, ...REF});
  const R = {}, N = mine.N; POS.forEach(q=>{ R[q] = PV[q].Rp * (mine.R[q] / (ref.R[q]||mine.R[q]||1)); });
  let out = [];
  if(c.league==='redraft'){
    let gS0 = 0; rows.forEach(r=>{ const l=r.lines[0]; if(l && l.g>gS0) gS0=l.g; });
    const rd = redraftAll(rows.map(r=>({...r, adj:adj[r.k]||0})), c, S, gS0, now);
    out = rd.out.filter(r=>r.v>0 || (r.lines[0] && r.lines[0].g>=3));
    out.forEach(r=>r.adj = +adj[r.k]||0);
    return finishBoard(out, c, cfgIn, rd.R, rd.N, S, now, {redraft:true, left:rd.left});
  }
  // how far into the latest season we are (most games anyone has played), for the no-snaps markdown
  let gS = 0; rows.forEach(r=>{ const l=r.lines[0]; if(l && l.g>gS) gS=l.g; });
  const bench = Math.min(1, gS/8);
  rows.forEach(r=>{
    if(r.ageNow==null) return;
    if(!r.w.den && !r.dp) return;                     // no games and no draft capital: nothing to value
    const az = r.ath!=null ? Math.max(-2, Math.min(2, r.ath)) : 0;
    const cz = r.comp ? Math.max(-2, Math.min(2.5, r.comp[0])) : 0;
    const dpE = r.dp ? Math.max(1, r.dp*Math.exp(-ATH[r.pos]*az*(c.athw!=null?c.athw:1) + COMPB[r.pos]*cz)) : r.dp;
    const wv = r.moved ? {...r.w, num:r.w.num*MOVE_TRUST, den:r.w.den*MOVE_TRUST} : r.w;
    const st = lifetime(r.pos, wv, r.ageNow, dpE, !!r.inj, R[r.pos], c.upside*(r.moved?MOVE_SPREAD:1), c.dcw, c.mode, bench, outMult(r.out, false));
    if(r.moved) st.moved = r.moved; if(r.out) st.out = r.out;
    st.dpE = dpE;
    const ov = ovrLeft(r.ovr, now), miss = r.inj && !ov ? 0 : Math.max(ov, r.inj ? 0 : expMiss(r.rep));
    if(ov) st.ovr = r.ovr;
 // IR already carries its own, larger markdown, so short-injury math only applies off IR
    if(miss && !r.inj){ st.miss = miss; st.missF = 1 - PV[r.pos].inj*Math.min(1, miss/17); st.value *= st.missF; }   // games lost out of a season, at the position's injury cost
    const a = +adj[r.k]||0;
    out.push({...r, st, base:st.value, adj:a, v: st.value*(1+a/100)});
  });
  // team direction: within each position, players whose value comes sooner (win now) or later (rebuild) than the
  // position's typical top-40 player move up; the position's overall level stays put, so positions stay comparable
  if(c.mode && c.mode!=='neutral') POS.forEach(q=>{
    const xs = out.filter(r=>r.pos===q).sort((a,b)=>b.base-a.base), top = xs.slice(0,40);
    const avg = top.reduce((a,r)=>a+r.st.tilt,0)/Math.max(1,top.length);
    xs.forEach(r=>{ const f = avg>0 ? r.st.tilt/avg : 1; r.modeF = f; r.base *= f; r.v = r.base*(1+(r.adj||0)/100); });
  });
  return finishBoard(out, c, cfgIn, R, N, S, now, {});
}
function finishBoard(out, c, cfgIn, R, N, S, now, extra){
  // Value first. Players whose values round to the same number (most often the many 0s below replacement) are ordered by how close
  // their expected scoring is to replacement at their position, then by this season's scoring, then by expert rank.
  const gapR = r => r.st && r.st.redraft ? r.st.raw/10 : r.st && r.st.ppg!=null && r.st.R ? (r.st.ppg - r.st.R)/r.st.R : -9;   // redraft: how far below replacement over the games he has left
  const cur = r => r.lines && r.lines[0] ? r.lines[0].ppg : -1;
  const er = r => { const x = r.ecr && (r.ecr[0]||r.ecr[1]||r.ecr[2]); return x || 9999; };
  out.sort((a,b)=> (Math.round(b.v*10)-Math.round(a.v*10)) || (gapR(b)-gapR(a)) || (cur(b)-cur(a)) || (er(a)-er(b)) || String(a.n).localeCompare(String(b.n)));
  const pr = {}; out.forEach((r,i)=>{ r.rank=i+1; pr[r.pos]=(pr[r.pos]||0)+1; r.prank=pr[r.pos]; });
  tierCut(out.map(r=>r.v), 240).forEach((t,i)=>out[i].tier=t);
  POS.forEach(q=>{ const xs = out.filter(r=>r.pos===q); tierCut(xs.map(r=>r.v), 80).forEach((t,i)=>xs[i].ptier=t); });
  // expert consensus (FantasyPros, for comparison only): dynasty superflex / dynasty 1QB / redraft (1QB only)
  const em = extra.redraft ? ((c.sf || c.qb>=2) ? -1 : 2) : ((c.sf || c.qb>=2) ? 0 : 1);
  out.forEach(r=>{ r.ecrRank = em>=0 && r.ecr && r.ecr[em] ? r.ecr[em] : null; r.ecrPos = null; });
  POS.forEach(q=>{ out.filter(r=>r.pos===q && r.ecrRank).sort((a,b)=>a.ecrRank-b.ecrRank).forEach((r,i)=>r.ecrPos=i+1); });
  return {rows:out, picks: extra.redraft ? [] : pickBoard(out, c, S, now), R, N, season:S, cfg:c, ecrAt:cfgIn.__ecrAt||null, redraft:!!extra.redraft, left:extra.left};
}
// ---- Redraft: rest-of-season points above replacement ----
// This season is the evidence; last season counts a little (up to 6 games at half weight); four phantom games at replacement
// keep small samples honest. Replacement comes straight from your lineup. Value = (expected PPG - replacement) x games left.
function redraftAll(rows, c, S, gS, nowR){
  const cands = rows.filter(r=>r.lines[0] && r.lines[0].g>=3).map(r=>({pos:r.pos, ppg:r.lines[0].ppg}));
  const {R, N} = replacement(cands, c);
  const left = c.__left!=null ? c.__left : Math.max(0, 17 - gS), out = [];   // __left: compare past and present over the same games
  rows.forEach(r=>{
    const l1 = r.lines[0], l2 = r.lines[1];

// Tiers by natural breaks: split the top N values into K groups so players inside a tier are as close in value as possible
// (least total squared distance from each tier's average, solved exactly). K grows with the square root of N; everyone below N is "depth".
function tierCut(vals, N){
  const n = Math.min(vals.length, N); if(!n) return [];
  const K = Math.max(3, Math.min(16, Math.round(Math.sqrt(n)))), MIN = 2;
  const p1=[0], p2=[0]; for(let i=0;i<n;i++){ p1.push(p1[i]+vals[i]); p2.push(p2[i]+vals[i]*vals[i]); }
  const sse = (i,j) => { const m=j-i, s=p1[j]-p1[i]; return (p2[j]-p2[i]) - s*s/m; };   // players i..j-1
  const D = [Array(n+1).fill(Infinity)], B = [[]]; D[0][0] = 0;
  for(let k=1;k<=K;k++){ D[k]=Array(n+1).fill(Infinity); B[k]=Array(n+1).fill(0);
    for(let j=k*MIN;j<=n;j++) for(let i=(k-1)*MIN;i<=j-MIN;i++){ const v=D[k-1][i]+sse(i,j); if(v<D[k][j]){ D[k][j]=v; B[k][j]=i; } } }
  const t = Array(vals.length).fill(99); let j=n;   // 99 = depth, below the tiered part of the board
  for(let k=K;k>=1;k--){ const i=B[k][j]; for(let x=i;x<j;x++) t[x]=k; j=i; }
  return t;
}

// Rookie draft picks, valued as the player they usually turn into on THIS board. The last two rookie classes are lined up
// best to worst under your format: the best rookie is what 1.01 became, the 13th-best is what 2.01 became (12 teams), and so on.
// Hindsight makes that too tidy (nobody drafts the bust last), so each slot is averaged with its neighbours and pulled 25% toward
// its round's average. Picks a year or two out are valued at their round's average, discounted for the wait.
const PICK_ROUNDS = 4;

function pickBoard(rows, c, S, now){
  const nT = c.teams, n = nT*PICK_ROUNDS, curves = [];

    const raw = []; for(let j=0;j<n;j++) raw.push(j < v.length ? v[j] : v[v.length-1]*Math.pow(0.9, j-v.length+1)); curves.push(raw); });
  if(!curves.length) return [];
  const raw = curves[0].map((_,j)=>curves.reduce((a,cv)=>a+cv[j],0)/curves.length);
  const sm = raw.map((_,j)=>{ let a=0,m=0; for(let x=Math.max(0,j-2);x<=Math.min(n-1,j+2);x++){ a+=raw[x]; m++; } return a/m; });
  const out = [], Y = nextDraftYear(now), pad = x => String(x).padStart(2,'0'), ord = ['1st','2nd','3rd','4th'];
  for(let r=0;r<PICK_ROUNDS;r++){
    const seg = sm.slice(r*nT,(r+1)*nT), mean = seg.reduce((a,x)=>a+x,0)/seg.length;
    seg.forEach((x,i)=>out.push({k:`pk${Y}-${r+1}.${pad(i+1)}`, n:`${Y} Pick ${r+1}.${pad(i+1)}`, pos:'PK', yr:Y, rd:r+1, slot:i+1, v:(0.75*x+0.25*mean)*classF(c,Y)}));
    (MODES[c.mode]||MODES.neutral).later.forEach((f,yy)=>out.push({k:`pk${Y+yy}-${r+1}`, n:`${Y+yy} ${ord[r]}`+(yy===0?' (slot unknown)':''), pos:'PK', yr:Y+yy, rd:r+1, v:mean*f*classF(c,Y+yy), generic:true}));

// ---- Value history: the whole board rebuilt as it would have looked at earlier points, under the viewer's own format.
// End of each of the last three seasons, then every completed week of this one. Each point only sees the games played by
// then, and everyone is as old as they were. Injury news, outlook notes and team changes are only known for today, so past
// points leave them out (except a player on IR who hadn't played since that week). The last point is today's board.
const DAYMS = 864e5;
function wk1Thu(Y){ const d = new Date(Date.UTC(Y, 8, 1)).getUTCDay(); return Date.UTC(Y, 8, 1 + ((8 - d) % 7) + 3, 12); }   // Thursday after Labor Day
function weekEnd(Y, w){ return wk1Thu(Y) + (5 + 7*(w-1))*DAYMS; }   // the Tuesday after week w's games
function valueHistory(players, cfg, adj, S, nowT){
  const strip = p => ({...p, inj:null, rep:null, ovr:null, moved:null, out:null, rk:false, s30:undefined});
  const stripY = p => ({...strip(p), comp:null});
  const pts = [];
  if(cfg.league!=='redraft') [S-3, S-2, S-1].forEach(Y=>{
    const ps = players.filter(p=>!p.dy || p.dy<=Y).map(p=>{ const s = {}; Object.keys(p.s||{}).forEach(y=>{ if(+y<=Y) s[y] = p.s[y]; }); return {...stripY(p), s}; });
    pts.push({lab:"End '"+String(Y).slice(2), t:weekEnd(Y, 18), ps, sep:Y===S-1});
  });
  for(let w=1; w<40; w++){
    const t = weekEnd(S, w); if(t > nowT - 2*DAYMS) break;   // the latest week is today's board
    const ps = players.filter(p=>!p.dy || p.dy<=S).map(p=>{
      let a = null, last = 0;
      Object.entries(p.wk||{}).forEach(([x, l])=>{ x = +x; if(x>last) last = x; if(x<=w) a = a ? a.map((v,i)=>v+(+l[i]||0)) : l.map(v=>+v||0); });
      const q = strip(p); if(p.inj && last < w) q.inj = p.inj;
      return {...q, s:{...p.s, [S]: a || 0}};
    });
    pts.push({lab:'W'+w, t, ps});
  }
  return pts.map(x=>{ const m = rankAll(x.ps, cfg, x.t, adj), by = {}; m.rows.forEach(r=>by[r.k] = {v:r.v, rank:r.rank, prank:r.prank}); return {lab:x.lab, t:x.t, sep:x.sep, by}; });
}
function ValueHistory({r, H}){
  const [sel, setSel] = useState(null);
  if(!H) return html`<div class="chart wide"><div class="eyebrow">Value history</div><p class="note">Rebuilding past boards…</p></div>`;
  const P = [...H.map(h=>({lab:h.lab, sep:h.sep, x:h.by[r.k]})), {lab:'Now', x:{v:r.v, rank:r.rank, prank:r.prank}}];
  const hasAny = P.filter(p=>p.x).length;
  if(hasAny < 2) return html`<div class="chart wide"><div class="eyebrow">Value history</div><p class="note">Not enough history yet: he wasn't on the board before this season.</p></div>`;
  const W = 320, Hh = 130, L = 26, Rr = 8, n = P.length, mx = Math.max(1, ...P.map(p=>p.x ? p.x.v : 0))*1.12;
  const sx = i => L + i*(W-L-Rr)/(n-1), sy = v => Hh - (Hh-10)*v/mx;
  let d = '', pen = false; P.forEach((p,i)=>{ if(!p.x){ pen = false; return; } d += (pen?'L':'M')+sx(i).toFixed(1)+' '+sy(p.x.v).toFixed(1)+' '; pen = true; });
  const i0 = sel!=null && P[sel] && P[sel].x ? sel : n-1, cur = P[i0];
  const first = P.find(p=>p.x), ws = P.find(p=>p.lab==='W1' && p.x), base = ws || first, chg = r.v - base.x.v;
  const ticks = [0, mx/2/1.12, mx/1.12].map(v=>Math.round(v));
  const sepI = P.findIndex(p=>p.lab==='W1');
  return html`<div class="chart wide"><div class="eyebrow">Value history · your format</div>
    <div class="hread"><b>${cur.lab==='Now'?'Today':cur.lab.replace("End '", 'End of 20').replace(/^W(\d+)/,'After week $1')}</b>
      <span class="num">${fmtV(cur.x.v)}</span><span>${r.pos}${cur.x.prank} · #${cur.x.rank} overall</span>
      <span class=${'chg '+(chg>=0.5?'up':chg<=-0.5?'dn':'')}>${chg>=0?'+':''}${fmt(chg,0)} since ${base.lab==='W1'?'week 1':base.lab.replace("End '", "end of '")}</span></div>
    <svg viewBox=${`0 0 ${W} ${Hh+18}`} role="img" aria-label=${'Value history for '+r.n}>
      ${ticks.map(v=>html`<g key=${'t'+v}><line x1=${L} x2=${W-Rr} y1=${sy(v)} y2=${sy(v)} stroke="var(--line)" stroke-dasharray=${v?'2 3':''}/><text x=${L-4} y=${sy(v)+3} text-anchor="end">${v}</text></g>`)}
      ${sepI>0 ? html`<line x1=${(sx(sepI)+sx(sepI-1))/2} x2=${(sx(sepI)+sx(sepI-1))/2} y1="4" y2=${Hh} stroke="var(--line2)" stroke-dasharray="3 3"/>` : null}
      <path d=${d} fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>

function Trade({M}){
  const [sides, setSides] = useState(()=>lsGet('dvb.trade', [[],[]]));
  const [q, setQ] = useState(['','']);
  useEffect(()=>lsSet('dvb.trade', sides), [sides]);
  if(!M || !M.rows.length) return html`<div class="panel empty"><b>No values yet</b><span>The trade calculator opens once the board has players.</span></div>`;
  const byK = Object.fromEntries([...M.rows, ...(M.picks||[])].map(r=>[r.k, r]));
  const star = M.cfg.star;
  const tot = s => s.reduce((a,k)=>a + (byK[k] ? tradeVal(byK[k].v, star) : 0), 0);
  // a side's total is shown as the one player it's worth: (Σ value^premium)^(1/premium)
  const T = sides.map(tot), E = T.map(t=>t>0 ? Math.pow(t, 1/star) : 0), mx = Math.max(E[0], E[1]), diff = mx ? Math.abs(E[0]-E[1])/mx : 0;
  const need = Math.pow(Math.abs(T[0]-T[1]), 1/star);   // one player worth this closes the gap
  const add = (i,k) => { const s = sides.map(x=>x.slice()); if(!s[i].includes(k)) s[i].push(k); setSides(s); const qq=q.slice(); qq[i]=''; setQ(qq); };
  const rm = (i,k) => { const s = sides.map(x=>x.filter(y=>y!==k)); setSides(s); };
  const sugg = i => { const nq = normName(q[i]); if(nq.length<2) return []; return [...M.rows, ...(M.picks||[])].filter(r=>normName(r.n).includes(nq) || (r.pos==='PK' && normName(r.n.replace(/^\\d+ (Pick )?/,'')).startsWith(nq))).slice(0,8); };
  return html`<div class="panel"><h2>Trade calculator</h2>
    <p class="sub">Each side's players are added up with a star premium (value<sup>${star}</sup>), so two 200s don't equal one 400. Each side's total is what the package is worth as a single player. Change the premium on the Format tab.</p></div>
    <div class="tgrid">${[0,1].map(i=>html`<div class="panel side" key=${i}>
      <div style=${{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}><h2>Side ${i?'B':'A'}</h2><span class="mono" style=${{fontWeight:600,fontSize:18}}>${fmt(E[i])}</span></div>
      ${sides[i].map(k=>byK[k] ? html`<div class="pick" key=${k}><span><${PosTag} p=${byK[k].pos}/> ${byK[k].n}</span><span class="mono">${fmt(byK[k].v)} <button aria-label=${'Remove '+byK[k].n} onClick=${()=>rm(i,k)}>×</button></span></div>` : null)}
      <input id=${'tq'+i} class="search" type="search" placeholder="Add a player or pick (e.g. 2027 1st, 1.05)" value=${q[i]} onInput=${e=>{ const qq=q.slice(); qq[i]=e.target.value; setQ(qq); }}/>
      ${sugg(i).length ? html`<div class="sugg">${sugg(i).map(r=>html`<button key=${r.k} onClick=${()=>add(i,r.k)}><span><${PosTag} p=${r.pos}/> ${r.n}</span><span class="mono">${fmt(r.v)}</span></button>`)}</div>` : null}
    </div>`)}</div>
    ${!(sides[0].length+sides[1].length) ? html`<div class="panel empty"><b>Build a trade</b><span>Search a player or a pick on each side, like “Nacua” or “2027 1st”. Totals and a fair-or-not verdict appear as you add.</span></div>` : null}
    ${T[0] && T[1] ? html`<div class=${'verdict '+(diff<0.05?'fair':'off')}>${diff<0.05 ? 'Fair: within 5% either way.' : `Side ${T[0]>T[1]?'A':'B'} gets ${fmt(100*diff,0)}% more value. Side ${T[0]>T[1]?'B':'A'} needs to add about a ${fmt(need)} player to even it.`}</div>` : null}
    ${sides[0].length+sides[1].length ? html`<div><button class="btn" onClick=${()=>setSides([[],[]])}>Clear both sides</button></div>` : null}`;
}

function Method({M, meta}){
  const R = M ? M.R : null;
  return html`<div class="panel"><h2>How a value is built</h2>
      <p>Every number on this board comes from one formula run over each player's real game logs. Nothing is copied from another site's rankings.</p>
      <h3>1. Production, scored your way</h3>
      <p class="sub">Each season's raw stats (yards, touchdowns, catches, turnovers) are scored with your settings, then averaged per game. This season counts more than last season; two seasons ago counts least, except at TE where it keeps real weight.</p>
      <h3>2. Pulled toward replacement</h3>
      <p class="sub">A player's average gets blended with phantom games at the level a player like him usually reaches: near replacement for an early first-round pick, well below it for a late-round or undrafted player. A hot few weeks can't vault a backup past a proven starter, and a backup with one start can't coast on being young. QBs get the most phantom games (see the table) because one QB season says the least about the next.</p>
      <h3>3. Draft capital for young players</h3>
      <p class="sub">Draft slot sets where a thin record gets pulled to. It fades out as a player racks up games (gone after about two full seasons) and by age 26, so a bust first-rounder stops coasting on pedigree and a late-round breakout isn't held back by it. Rookies with no games start from draft slot alone. Once a season is underway, a rookie who still hasn't taken a snap is marked down (up to 20% by week 8), because someone is ahead of him; an early-round pick keeps a wide range of outcomes, so some upside survives.</p>
      <h3>Injuries</h3>
      <p class="sub">IR, PUP and suspensions mark a player down by his position's injury cost. Shorter injuries come from the weekly injury report, injury news ("out 4–6 weeks") is checked automatically after every slate of games for hurt players who matter, and the owner can overrule it; either way it counts down a game a week: Out counts as about one more missed game plus three-quarters of a game for each straight week he's already been out; Doubtful 0.8, Questionable 0.25, a missed practice 0.3, and concussions add half a game. In dynasty that's a small markdown (games lost out of a season); in redraft those games come straight off the games he has left.</p>
      <h3>Athleticism</h3>
      <p class="sub">A combine composite (size-adjusted speed counts double, then vertical, broad jump, 3-cone and shuttle, against players at the same position) nudges a young player's draft slot. It only counts where it has predicted fantasy points beyond draft slot: tested on the 2017–23 draft classes, it clearly helps at TE, a little at RB and QB, and not at WR. It fades out with draft slot as a player builds a record, and players who skipped drills are treated as average.</p>
      <h3>4. A career, not a season</h3>
      <p class="sub">The value adds up every future season: points above replacement, plus the worth of his upside outcomes, times the chance he's still a fantasy starter at that age. That chance falls off around age 30 for RBs, 33 for TEs, 36 for WRs and 39 for QBs. QB and RB years further out are discounted the most.</p>
      <h3>5. Your format sets replacement</h3>
      <p class="sub">Replacement level comes from your lineup: in a deeper league, or superflex for QBs, the replacement player is worse, so starters are worth more.</p>
      ${R ? html`<div class="tscroll"><table><thead><tr><th>Position</th><th>Starters</th><th>Replacement PPG</th><th>Fades by</th><th>Phantom games</th></tr></thead><tbody>
        ${POS.map(q=>html`<tr key=${q}><td><${PosTag} p=${q}/></td><td>${M.N[q]}</td><td>${fmt(R[q],1)}</td><td>${fmt(PV[q].mid,0)}</td><td>${fmt(PV[q].shr,0)}</td></tr>`)}</tbody></table></div>` : null}
      <h3>Big changes</h3>
      <p class="sub">The numbers can't see a trade or a new depth chart coming, so two things cover it. A player who changes teams (trade, signing or release) is flagged automatically: his old numbers count 25% less and his range of outcomes widens until he builds a record in the new offense. And an outlook (much worse, worse, better, much better) moves his expected scoring by 9 or 18%; dynasty uses 60% of that, since situations change again. Outlooks are set by the news check after each slate of games for players who changed teams or lost a key teammate for the season, and the board's owner can set or overrule any of them.</p>
      <h3>Redraft</h3>
      <p class="sub">Switching to redraft swaps the career math for this season only: this season's PPG (plus up to six games of last season at half weight, plus four phantom games just under replacement), minus a replacement starter in your lineup, times games left in the fantasy regular season. Injured players count 40% of their remaining games.</p>
      <h3>Team direction</h3>
      <p class="sub">Win now weights this season 1.6×, next season 1.2×, and later seasons less each year; rebuild weights this season 0.35×, next 0.9× and every season after 1.15×. A player moves up or down against the typical top-40 player at his position, so a 31-year-old RB climbs in win-now and slides in rebuild while positions stay comparable. Win now also trims what upside is worth and makes future picks feel further away; rebuild does the opposite.</p>
      <h3>Tiers</h3>
      <p class="sub">Tiers are cut where values naturally clump. The top 240 players (top 80 at a position) are split so players inside a tier are as close in value as possible, with the number of tiers set by the size of the list. Elite tiers come out small because values are spread out at the top; lower tiers hold more players because values bunch together. Everyone below is listed as depth.</p>
      <h3>Expert consensus</h3>
      <p class="sub">ECR is FantasyPros' dynasty expert consensus (via DynastyProcess), refreshed weekly with the stats. It sits next to each player so you can see where your board disagrees; it never feeds into a value.</p>
      <h3>The formula</h3>
      <div class="eq">PPG = (Σ w·pts + n·R) ÷ (Σ w·games + n)</div>
      <div class="eq">value = k × Σ<sub>years</sub> dʲ × alive(age) × [ (PPG − R)·Φ(z) + σ·φ(z) ],  z = (PPG − R) ÷ σ</div>
      <p class="sub" style=${{marginTop:8}}>Φ and φ are the normal curve; σ is uncertainty, larger for young players. Injured players (IR or out) are marked down by position. The shape was fitted position by position on three seasons of real stats against a blend of two outside boards (PlayerProfiler and FantasyPros expert consensus), inside football guard rails: QBs fade around 35–40, RBs 27–31, WRs and TEs 31–35, no position is discounted more than 20% a year, and QBs' records are trusted most because QB production carries over best year to year. Values land on the familiar 0–500 dynasty scale; your board still disagrees with the experts plenty.</p>
    </div>
    <div class="panel"><h2>Data</h2>
      <div class="kv"><span>Players on the board</span><span class="mono">${M ? M.rows.length : '–'}</span></div>
      <div class="kv"><span>Seasons used</span><span class="mono">${M ? `${M.season-2}–${M.season}` : '–'}</span></div>
      <div class="kv"><span>Games into ${meta&&meta.season||'this season'}</span><span class="mono">${meta && meta.games ? meta.games : '–'}</span></div>
      <div class="kv"><span>Stats last pulled</span><span class="mono">${meta && meta.at ? new Date(meta.at).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '–'}</span></div>
      <p class="note" style=${{marginTop:8}}>Stats, ages and draft slots come from nflverse, the free public NFL data project (CC-BY). They're pulled Monday, Tuesday and Friday evenings (after Sunday, Monday night and Thursday night games, and Friday's final injury report), so the board stays current without anyone opening it.</p>
    </div>`;
}

/* ---------- app ---------- */
const VIEWS = ['home','board','trade','format','method'];
const ico = d => html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const TABS = [
  ['home','Home', ico(html`<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>`)],
  ['board','Rankings', ico(html`<path d="M4 6h16M4 12h16M4 18h10"/>`)],
  ['trade','Trade', ico(html`<path d="M7 7h12l-3-3M17 17H5l3 3"/>`)],
  ['format','Format', ico(html`<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>`)],
  ['method','Method', ico(html`<path d="M5 4h14v16H5z"/><path d="M9 8h6M9 12h6M9 16h4"/>`)] ];
function App(){
  const [D, setD] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [view, setView] = useState(()=>{ const h = (location.hash||'').slice(1); return VIEWS.includes(h) ? h : 'home'; });
  const [cfgL, setCfgL] = useState(()=>lsGet('dvb.cfg', null));
  const [open, setOpen] = useState(null);
  const [mine, setMine] = useState(()=>new Set(lsGet('dvb.mine', [])));
  const toggleMine = k => { const s = new Set(mine); s.has(k) ? s.delete(k) : s.add(k); setMine(s); lsSet('dvb.mine', [...s]); };
  const [canEdit, setCanEdit] = useState(false);
  const [status, setStatus] = useState({busy:false, done:0, total:0, err:null});
  const dbRef = useRef(null);
  const [now] = useState(Date.now());

  useEffect(()=>{ const f=()=>{ const h=(location.hash||'').slice(1); if(VIEWS.includes(h)) setView(h); }; window.addEventListener('hashchange', f); return ()=>window.removeEventListener('hashchange', f); }, []);
  const go = v => { setView(v); try{ history.replaceState(null, '', '#'+v); }catch(e){} window.scrollTo(0,0); };

  useEffect(()=>{ let unsubs = [], alive = true;
    const t = setTimeout(()=>{ if(alive) setLoaded(true); }, 10000);
    (async()=>{
      const db = window.claude ? await window.claude.use('db') : null;
      if(!db){   // public website: read the published snapshot (data.json) instead of the live board's storage
        try{
          const r = await fetch('data.json', {cache:'no-store'}); if(!r.ok) throw new Error('no data');
          const d = await r.json(), o = {};
          ['meta','adj','defaults','classes','injuries','outlook',...POS].forEach(k=>{ o[k] = d[k]||null; o['_'+k] = true; });
          setD(o);
        }catch(e){ setStatus(s=>({...s, err:'Sign in to claude.ai to see the board.'})); }
        setLoaded(true); return; }
      dbRef.current = db;
      ['meta','adj','defaults','classes','injuries','outlook',...POS].forEach(k=>{
        unsubs.push(db.doc('board/'+k).onSnapshot(snap=>{ const d = snap.exists ? snap.data() : null; setD(o=>({...o, [k]:d, ['_'+k]:true})); }, ()=>{}));
      });
      try{ const u = await window.claude.use('user'); if(u && await u.canEdit()) setCanEdit(true); }catch(e){}
    })();
    return ()=>{ alive=false; clearTimeout(t); unsubs.forEach(u=>{ try{u();}catch(e){} }); };
  }, []);
  const ready = ['meta','adj','defaults','classes','injuries','outlook',...POS].every(k=>D['_'+k]);
  useEffect(()=>{ if(ready) setLoaded(true); }, [ready]);

  const def = {...DEF, ...((D.defaults&&D.defaults.cfg)||{})};
  const cfg = {...def, ...(cfgL||{})};
  const setCfg = c => { setCfgL(c); lsSet('dvb.cfg', c); };

  const players = useMemo(()=>{
    const out = [];
    const OV = (D.injuries&&D.injuries.rows)||{}, OL = (D.outlook&&D.outlook.rows)||{};
    POS.forEach(q=>Object.entries((D[q]&&D[q].rows)||{}).forEach(([k,e])=>{
      if(e.nf || !e.s || e.age==null) return;
      out.push({k, n:e.n, pos:q, team:e.team, age:e.age, ad:e.ad||now, dp:e.dp||null, dy:e.dy||null, inj:e.inj, rk:e.rk, s:e.s, s30:e.s30, wk:e.wk||null, ecr:e.ecr||null, ath:e.ath!=null?e.ath:null, comp:e.comp||null, rep:e.rep||null, ovr:OV[k]||null, moved:e.moved||null, out:OL[k]||null});
    }));
    return out;
  }, [D.QB, D.RB, D.WR, D.TE, D.injuries, D.outlook]);
  const M = useMemo(()=>{
    if(!players.length) return null;
    const adj = (D.adj&&D.adj.rows)||{}, cls = (D.classes&&D.classes.years)||{}, m = rankAll(players, {...cfg, __class:cls, __ecrAt:(D.meta&&D.meta.ecrAt)||null}, now, adj);
    const w30 = D.meta && D.meta.w30;
    if(w30){   // the same board as of ~30 days ago: this season's stats through week w30, everyone 30 days younger
      const S = String(m.season), then = now - 30*864e5;
      const past = players.map(p=> p.s30===undefined ? p : {...p, s:{...p.s, [S]:p.s30}});
      const m0 = rankAll(past, {...cfg, __class:cls, __left: m.left}, then, adj), by = {};
      m0.rows.forEach(r=>by[r.k]=r);
      m.rows.forEach(r=>{ const o = by[r.k]; if(o){ r.d30 = r.v - o.v; r.r30Overall = o.rank; } else if(r.s30!==undefined) r.d30 = r.v; });
      m.w30 = w30;
    }
    return m;
  }, [players, JSON.stringify(cfg), D.adj, D.meta, D.classes]);

  const saveAdj = async (k, v) => { const db = dbRef.current; if(!db) return; const rows = {...((D.adj&&D.adj.rows)||{})}; if(v) rows[k]=v; else delete rows[k]; await db.doc('board/adj').set({rows}); setOpen(null); };
  const saveInj = async (k, g, note) => { const db = dbRef.current; if(!db) return; const rows = {...((D.injuries&&D.injuries.rows)||{})}; if(g) rows[k] = {games:g, at:Date.now(), note, auto:false}; else delete rows[k]; await db.doc('board/injuries').set({rows}); };
  const saveOut = async (k, f, note) => { const db = dbRef.current; if(!db) return; const rows = {...((D.outlook&&D.outlook.rows)||{})}; if(f) rows[k] = {f, note, at:Date.now(), auto:false}; else delete rows[k]; await db.doc('board/outlook').set({rows}); };
  const saveClass = async (y, v) => { const db = dbRef.current; if(!db) return; const cl = D.classes || {}; await db.doc('board/classes').set({...cl, years:{...(cl.years||{}), [y]:v}}); };
  const saveDef = async c => { const db = dbRef.current; if(!db) return; await db.doc('board/defaults').set({cfg:{...c}}); setCfgL(null); lsSet('dvb.cfg', null); };

  // value history: built the first time a player is opened (about a dozen past boards), then kept until the data or format changes
  const [hist, setHist] = useState(null);
  const histKey = M ? JSON.stringify(cfg)+'|'+(D.meta&&D.meta.at)+'|'+JSON.stringify((D.adj&&D.adj.rows)||{}) : '';
  useEffect(()=>{
    if(!open || !M || (hist && hist.key===histKey)) return;
    const t = setTimeout(()=>{ try{
      const H = valueHistory(players, {...cfg, __class:(D.classes&&D.classes.years)||{}}, (D.adj&&D.adj.rows)||{}, M.season, now);
      setHist({key:histKey, H});
    }catch(e){ console.error(e); setHist({key:histKey, H:[]}); } }, 60);
    return ()=>clearTimeout(t);
  }, [open, histKey, !!M]);
  const st = D.meta && D.meta.at ? html`<span class="chip"><span class="dot"></span>${ago(D.meta.at)}</span>` : null;
  const openRow = open && M ? M.rows.find(r=>r.k===open) : null;
  return html`<header class="top"><div class="wrap">
      <div class="brand grow"><span class="mark" aria-hidden="true">DV</span><div style=${{minWidth:0}}><b>Dynasty Value Board</b><small>${fmtSummary(cfg)}</small></div></div>
      <nav class="dtabs" aria-label="Sections">${TABS.map(([v,l])=>html`<button key=${v} aria-current=${view===v?'page':null} onClick=${()=>go(v)}>${l}</button>`)}</nav>
      ${st}</div></header>
    <main class="wrap">
      ${!loaded ? html`<div class="panel empty"><b>Loading the board</b><span>Fetching the latest values.</span></div>`
        : view==='home' ? html`<${Dashboard} M=${M} D=${D} cfg=${cfg} mine=${mine} onOpen=${r=>setOpen(r.k)} go=${go}/>`
        : view==='board' ? html`<${Board} M=${M} status=${status} onOpen=${r=>setOpen(r.k)} cfg=${cfg} setCfg=${setCfg} classes=${D.classes} canEdit=${canEdit} onClass=${saveClass} mine=${mine}/>`
        : view==='trade' ? html`<${Trade} M=${M}/>`
        : view==='format' ? html`<${FormatView} cfg=${cfg} setCfg=${setCfg} def=${def} canEdit=${canEdit} onSaveDef=${saveDef} hasFd=${!!(D.meta&&D.meta.fd&&(D.meta.fd.rec||D.meta.fd.rush))}/>`
        : html`<${Method} M=${M} meta=${D.meta}/>`}
    </main>
    <nav class="tabs" aria-label="Sections"><div class="wrap">${TABS.map(([v,l,ic])=>html`<button key=${v} aria-current=${view===v?'page':null} onClick=${()=>go(v)}>${ic}<span>${l}</span></button>`)}</div></nav>
    ${openRow ? html`<${Sheet} r=${openRow} M=${M} canEdit=${canEdit} onAdj=${saveAdj} onInj=${saveInj} onOut=${saveOut} starred=${mine.has(openRow.k)} onStar=${toggleMine} H=${hist && hist.key===histKey ? hist.H : null} onClose=${()=>setOpen(null)}/>` : null}`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
window.__dvb = {rankAll};

</script>
</body></html>
