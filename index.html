      dbRef.current = db;
      ['meta','adj','defaults','classes','injuries','outlook',...POS].forEach(k=>{
        unsubs.push(db.doc('board/'+k).onSnapshot(snap=>{ const d = snap.exists ? snap.data() : null; setD(o=>({...o, [k]:d, ['_'+k]:true})); }, ()=>{}));
      });
      unsubs.push(db.doc('board/fc').onSnapshot(snap=>{ const d = snap.exists ? snap.data() : null; if(d && d.v) setD(o=>({...o, fc:d})); }, ()=>{}));   // public trade values (FantasyCalc)
      unsubs.push(db.doc('board/prospects').onSnapshot(snap=>{ const d = snap.exists ? snap.data() : null; if(d && d.rows) setD(o=>({...o, prospects:d})); }, ()=>{}));   // next year's college prospects
      unsubs.push(db.doc('board/slmap').onSnapshot(snap=>{ const d = snap.exists ? snap.data() : null; if(d) setD(o=>({...o, slmap:d})); }, ()=>{}));   // Sleeper ids (older boards)
      unsubs.push(db.doc('board/ecr0').onSnapshot(snap=>{ const d = snap.exists ? snap.data() : null; if(d) setD(o=>({...o, ecr0:d})); }, ()=>{}));   // optional: report card
      // comparable-players library, stored in four parts (optional: the board works without it)
      { const parts = {}; [1,2,3,4,5,6,7,8].forEach(i=>unsubs.push(db.doc('board/comps'+i).onSnapshot(snap=>{ const d = snap.exists ? snap.data() : null; if(!d || d.v!==2) return; parts[i] = d;
          const of = d.of, ids = Array.from({length:of}, (_,j)=>j+1); if(ids.every(j=>parts[j] && parts[j].of===of && parts[j].built===d.built)) setD(o=>({...o, comps:mergeComps(ids.map(j=>parts[j]))})); }, ()=>{}))); }
      try{ const u = await window.claude.use('user'); if(u && await u.canEdit()) setCanEdit(true); }catch(e){}
    })();
    return ()=>{ alive=false; clearTimeout(t); unsubs.forEach(u=>{ try{u();}catch(e){} }); };
  }, []);
  const ready = ['meta','adj','defaults','classes','injuries','outlook',...POS].every(k=>D['_'+k]);
  useEffect(()=>{ if(ready) setLoaded(true); }, [ready]);

  const def = {...DEF, ...((D.defaults&&D.defaults.cfg)||{})};
  const cfg = {...def, ...(cfgL||{})};
  const setCfg = c => { setCfgL(c); lsSet('dvb.cfg', c); };

  const players = useMemo(()=>{
    const out = [];
    const OV = (D.injuries&&D.injuries.rows)||{}, OL = (D.outlook&&D.outlook.rows)||{};
    POS.forEach(q=>Object.entries((D[q]&&D[q].rows)||{}).forEach(([k,e])=>{
      if(e.nf || !e.s || e.age==null) return;
      out.push({k, n:e.n, pos:q, sl:e.sl||null, team:e.team, age:e.age, ad:e.ad||now, dp:e.dp||null, dy:e.dy||null, inj:e.inj, rk:e.rk, s:e.s, s30:e.s30, wk:e.wk||null, ecr:e.ecr||null, ath:e.ath!=null?e.ath:null, comp:e.comp||null, px:e.px||null, fa:e.fa||null, rep:e.rep||null, ovr:OV[k]||null, moved:e.moved||null, out:OL[k]||null});
    }));
    return out;
  }, [D.QB, D.RB, D.WR, D.TE, D.injuries, D.outlook]);
  const M = useMemo(()=>{
    if(!players.length) return null;
    const adj = (D.adj&&D.adj.rows)||{}, cls = (D.classes&&D.classes.years)||{}, m = rankAll(players, {...cfg, __class:cls, __ecrAt:(D.meta&&D.meta.ecrAt)||null, __env:(D.meta&&D.meta.env)||null, __comps:D.comps||null}, now, adj);
    const w30 = D.meta && D.meta.w30;
    if(w30){   // the same board as of ~30 days ago: this season's stats through week w30, everyone 30 days younger
      const S = String(m.season), then = now - 30*864e5;
      const past = players.map(p=> p.s30===undefined ? p : {...p, s:{...p.s, [S]:p.s30}});
      const m0 = rankAll(past, {...cfg, __class:cls, __left: m.left, __env:(D.meta&&D.meta.env)||null, __comps:D.comps||null}, then, adj), by = {};
      m0.rows.forEach(r=>by[r.k]=r);
      // Trend = his value today minus what his position rank of 30 days ago is worth today. (Raw values drift up for
      // everyone good as a season's games pile up, so a plain before/after would call nearly every star a riser.)
      const lad = {}; POS.forEach(q=>lad[q] = m.rows.filter(r=>r.pos===q).map(r=>r.v));
      m.rows.forEach(r=>{ const o = by[r.k]; if(o){ const L = lad[r.pos]; r.d30 = r.v - (L[Math.min(L.length, o.prank)-1] || 0); r.r30Overall = o.rank; r.p30 = o.prank; } else if(r.s30!==undefined) r.d30 = r.v; });
      m.w30 = w30;
    }
    return m;
  }, [players, JSON.stringify(cfg), D.adj, D.meta, D.classes, D.comps]);
  // public market (FantasyCalc, real trades) beside each player: his position rank there, its value on this board's scale,
  // and a flag where the two disagree a lot (a second look, never a change to his value)
  const slIdx = useMemo(()=>slIndex(players, D.slmap), [players, D.slmap]);
  useMemo(()=>{ if(!M || !D.fc || M.redraft) return; const mv = marketFn(M, D.fc, slIdx); if(mv.src!=='FantasyCalc') return;
    M.rows.forEach(r=>{ const pp = mv.rank(r); r.pubPos = pp; r.pubV = pp ? mv(r) : null; r.pubGap = pp ? r.v - r.pubV : null;
      const big = pp && (r.prank<=({QB:36,RB:60,WR:80,TE:30})[r.pos] || pp<=({QB:36,RB:60,WR:80,TE:30})[r.pos]);
      r.pubFlag = big && Math.abs(Math.log(r.prank/pp)) >= Math.log(1.75) && Math.abs(r.pubGap) >= Math.max(15, 0.3*Math.max(r.v, r.pubV)) ? (r.pubGap>0 ? 'above' : 'below') : null; });
    M.pubAt = D.fc.at; }, [M, D.fc, slIdx]);

  // next year's college prospects (board/prospects): valued by a second run of the board with them added as rookies who
  // haven't played, rescaled to today's board; the last class is valued the same way at zero games for a like-for-like ratio
  const [wantPro, setWantPro] = useState(false), [pro, setPro] = useState(null);
  const proKey = M && D.prospects ? JSON.stringify(cfg)+'|'+(D.meta&&D.meta.at)+'|'+(D.prospects.at||D.prospects.year)+'|'+(D.comps?1:0) : '';
  useEffect(()=>{ if(!wantPro || !proKey || (pro && pro.key===proKey)) return; setPro({key:proKey, busy:true, year:D.prospects.year});
    const t = setTimeout(()=>{ try{
      const Y = D.prospects.year, ad = Date.now(), pros = (D.prospects.rows||[]).filter(x=>POS.includes(x.pos)).map(x=>({k:'pro_'+normName(x.n), n:x.n, pos:x.pos, team:String(Y), age:x.age-((new Date(Y,8,1)-ad)/(365.25*864e5)), ad, dp:x.pick, dy:Y, s:{}, pro:1, school:x.school}));
      // last class as it stood before its first game: same players, no NFL record
      const yr = 365.25*864e5, sept = y => new Date(y,8,1).getTime();
      const last = players.filter(p=>p.dy===M.season && p.dp).map(p=>({...p, k:'was_'+p.k, s:{}, pro:1, inj:null, ovr:null, rep:null, out:null, comp:null, team:String(Y), dy:Y, ad,
        age:(p.age - ((p.ad||ad) - sept(M.season))/yr) - (sept(Y) - ad)/yr}));   // as a prospect a year on, at the age he was at his own draft
      const run = rankAll([...players, ...pros, ...last], {...cfg, __class:(D.classes&&D.classes.years)||{}, __comps:D.comps||null}, now, (D.adj&&D.adj.rows)||{});
      const byNow = Object.fromEntries(M.rows.map(r=>[r.k, r.v])), rat = run.rows.filter(r=>byNow[r.k]>50).map(r=>byNow[r.k]/r.v).sort((a,b)=>a-b), f = rat.length ? rat[rat.length>>1] : 1;
      const src = Object.fromEntries(pros.map(p=>[p.k, p])), rows = run.rows.filter(r=>src[r.k]).map(r=>{ const v = r.v*f; return {n:r.n, pos:r.pos, school:src[r.k].school, pick:src[r.k].dp, v, like:M.rows.filter(x=>x.v>v).length+1}; }).sort((a,b)=>b.v-a.v);
      const lastV = run.rows.filter(r=>r.k.startsWith('was_')).map(r=>r.v*f).sort((a,b)=>b-a), n = Math.min(12, rows.length, lastV.length);
      const ratio = n>=6 ? rows.slice(0,n).reduce((a,r)=>a+r.v,0)/lastV.slice(0,n).reduce((a,v)=>a+v,0) : null;
      setPro({key:proKey, year:Y, rows, ratio, n, src:D.prospects.src||''});
    }catch(e){ console.error(e); setPro({key:proKey, year:D.prospects.year, rows:[], ratio:null, n:0, src:''}); } }, 50);
    return ()=>clearTimeout(t); }, [wantPro, proKey]);
  const saveAdj = async (k, v) => { const db = dbRef.current; if(!db) return; const rows = {...((D.adj&&D.adj.rows)||{})}; if(v) rows[k]=v; else delete rows[k]; await db.doc('board/adj').set({rows}); setOpen(null); };
  const saveInj = async (k, g, note) => { const db = dbRef.current; if(!db) return; const rows = {...((D.injuries&&D.injuries.rows)||{})}; if(g) rows[k] = {games:g, at:Date.now(), note, auto:false}; else delete rows[k]; await db.doc('board/injuries').set({rows}); };
  const saveOut = async (k, f, note) => { const db = dbRef.current; if(!db) return; const rows = {...((D.outlook&&D.outlook.rows)||{})}; if(f) rows[k] = {f, note, at:Date.now(), auto:false}; else delete rows[k]; await db.doc('board/outlook').set({rows}); };
  const saveClass = async (y, v) => { const db = dbRef.current; if(!db) return; const cl = D.classes || {}; await db.doc('board/classes').set({...cl, years:{...(cl.years||{}), [y]:v}}); };
  const saveDef = async c => { const db = dbRef.current; if(!db) return; await db.doc('board/defaults').set({cfg:{...c}}); setCfgL(null); lsSet('dvb.cfg', null); };

  // value history: built the first time a player is opened (about a dozen past boards), then kept until the data or format changes
  const [hist, setHist] = useState(null), [wantHist, setWantHist] = useState(false);
  const histKey = M ? JSON.stringify(cfg)+'|'+(D.meta&&D.meta.at)+'|'+JSON.stringify((D.adj&&D.adj.rows)||{})+'|'+(D.comps?1:0) : '';
  useEffect(()=>{
    if(!(open || wantHist) || !M || (hist && hist.key===histKey)) return;
    const t = setTimeout(()=>{ try{
      const H = valueHistory(players, {...cfg, __class:(D.classes&&D.classes.years)||{}, __comps:D.comps||null}, (D.adj&&D.adj.rows)||{}, M.season, now);
      setHist({key:histKey, H});
    }catch(e){ console.error(e); setHist({key:histKey, H:[]}); } }, 60);
    return ()=>clearTimeout(t);
  }, [open, wantHist, histKey, !!M]);
  const st = D.meta && D.meta.at ? html`<span class="chip"><span class="dot"></span>${ago(D.meta.at)}</span>` : null;
  const openRow = open && M ? M.rows.find(r=>r.k===open) : null;
  return html`<header class="top"><div class="wrap">
      <div class="brand grow"><span class="mark" aria-hidden="true">DV</span><div style=${{minWidth:0}}><b>Dynasty Value Board</b><small>${fmtSummary(cfg)}</small></div></div>
      <nav class="dtabs" aria-label="Sections">${TABS.map(([v,l])=>html`<button key=${v} aria-current=${view===v?'page':null} onClick=${()=>go(v)}>${l}</button>`)}</nav>
      ${st}<${ThemeBtn}/></div></header>
    <main class="wrap">
      ${loaded && (view==='format'||view==='method') ? html`<div class="moreseg"><${Seg} label="More" value=${view} onChange=${go} opts=${[['format','Format'],['method','Method']]}/></div>` : null}
      ${!loaded ? html`<div class="panel empty"><b>Loading the board</b><span>Fetching the latest values.</span></div>`
        : view==='home' ? html`<${Dashboard} M=${M} D=${D} cfg=${cfg} mine=${mine} onOpen=${r=>setOpen(r.k)} go=${go}/>`
        : view==='board' ? html`<${Board} M=${M} status=${status} onOpen=${r=>setOpen(r.k)} cfg=${cfg} setCfg=${setCfg} classes=${D.classes} canEdit=${canEdit} onClass=${saveClass} mine=${mine} pro=${D.prospects ? (pro && pro.key===proKey ? pro : {busy:true, year:D.prospects.year}) : null} needPro=${()=>setWantPro(true)}/>`
        : view==='chart' ? html`<${Chart} M=${M} mine=${mine} onOpen=${r=>setOpen(r.k)}/>`
        : view==='trade' ? html`<${Trade} M=${M} cfg=${cfg} setCfg=${setCfg} players=${players} slmap=${D.slmap||null} fc=${D.fc||null} H=${hist && hist.key===histKey ? hist.H : null} needH=${()=>setWantHist(true)} hasFd=${!!(D.meta&&D.meta.fd&&(D.meta.fd.rec||D.meta.fd.rush))} onOpen=${r=>setOpen(r.k)} onStar=${keys=>{ const s = new Set(keys); setMine(s); lsSet('dvb.mine', [...s]); }}/>`
        : view==='format' ? html`<${FormatView} cfg=${cfg} setCfg=${setCfg} def=${def} canEdit=${canEdit} onSaveDef=${saveDef} hasFd=${!!(D.meta&&D.meta.fd&&(D.meta.fd.rec||D.meta.fd.rush))}/>`
        : html`<${Method} M=${M} meta=${D.meta} players=${players} cfg=${cfg} D=${D} onOpen=${r=>setOpen(r.k)}/>`}
    </main>
    <nav class="tabs" aria-label="Sections"><div class="wrap">${[...TABS.slice(0,4), ['more','More', ico(html`<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>`)]].map(([v,l,ic])=>{ const cur = v==='more' ? (view==='format'||view==='method') : view===v;
      return html`<button key=${v} aria-current=${cur?'page':null} onClick=${()=>go(v==='more' ? (view==='method'?'method':'format') : v)}>${ic}<span>${l}</span></button>`; })}</div></nav>
    ${openRow ? html`<${Sheet} r=${openRow} M=${M} canEdit=${canEdit} onAdj=${saveAdj} onInj=${saveInj} onOut=${saveOut} starred=${mine.has(openRow.k)} onStar=${toggleMine} H=${hist && hist.key===histKey ? hist.H : null} onClose=${()=>setOpen(null)}/>` : null}`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
window.__dvb = {rankAll};

</script>
</body></html>
